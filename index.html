<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>

body {
  margin: 0;
  overflow: hidden;
  font-family: "微軟正黑體", "Microsoft JhengHei", sans-serif;
}

    #background {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;
    }
    #character {
      position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); height: 60%;
    }

    .top-bar {
      position: absolute; top: 0; left: 0; width: 100%;
      background: rgba(255,255,255,0.6);
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 20px; z-index: 2; border-bottom: 1px solid #ccc;
    }

.top-left {
  display: flex;
  flex-direction: column;
  font-size: 18px;  /* 玩家名和生日稍微大一點 */
  color: #8b5e3c;
  font-weight: bold;
  text-shadow: 0 0 1px rgba(0, 0, 0, 0.2);
}

.resources {
  display: flex;
  gap: 15px;
  font-size: 16px;
  color: #8b5e3c;
  font-weight: bold;
  text-shadow: 0 0 1px rgba(0, 0, 0, 0.2);
}

    .attributes {
      display: flex; gap: 10px; margin-left: 20px;
    }

    .attribute {
      position: relative;
      width: 100px;
      height: 16px;
      background: #eee;
      border-radius: 4px;
    }

    .fill {
      height: 100%;
      background: linear-gradient(90deg, #70c1ff, #4da8da);
      border-radius: 4px;
    }

.attribute-label {
  position: absolute;
  top: -20px;
  left: 0;
  font-size: 14px;
  color: #8b5e3c;
  font-weight: bold;
  text-shadow: 0 0 1px rgba(0, 0, 0, 0.2);
}

    .gear {
      font-size: 20px; cursor: pointer;
    }

    .bottom-bar {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 15px;
    }

    .bottom-item {
      background: #fef9f4; border: 2px solid #d1cfc7; border-radius: 20px; width: 60px; height: 70px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.1); cursor: pointer;
    }

    .icon {
      font-size: 24px;
    }
    .side-bar {
  position: absolute;
  top: 50%;
  right: 0;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  gap: 10px;
  background: rgba(255, 255, 255, 0.5);
  padding: 10px;
  border-radius: 8px 0 0 8px;
}

.side-item {
  cursor: pointer;
  font-size: 14px;
  padding: 8px;
  background: #fef9f4;
  border: 1px solid #d1cfc7;
  border-radius: 4px;
}
.adventure-modal {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(255,255,255,0.9);
  border: 2px solid #333;
  border-radius: 8px;
  padding: 20px;
  width: 80%;
  max-width: 600px;
  z-index: 10;
}

.adventure-content img {
  width: 100%;
  border-radius: 4px;
}

.adventure-text {
  margin-top: 15px;
  font-size: 16px;
  color: #333;
}

.adventure-options {
  margin-top: 20px;
  display: flex;
  gap: 10px;
  justify-content: center;
}

.hidden {
  display: none;
}
#side-panel {
  position: fixed;
  top: 80px;   /* 依照你的畫面可調 */
  left: 0;
  width: 220px;
  background: rgba(255, 255, 255, 0.85);
  border-right: 2px solid #ccc;
  padding: 10px;
  font-family: 'jf-openhuninn', sans-serif;
  z-index: 10;
}

#side-panel h4 {
  margin: 5px 0;
  font-size: 16px;
  border-bottom: 1px solid #999;
  padding-bottom: 3px;
}

#status-box, #attributes-box {
  margin-bottom: 20px;
}

.status-item {
  margin: 5px 0;
  font-size: 14px;
}

.status-detail {
  font-size: 12px;
  color: #666;
  margin-left: 15px;
}

.attribute-item {
  margin: 4px 0;
  font-size: 14px;
}
#recent-log-box {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 420px;
  background: rgba(255, 255, 255, 0.9);
  border: 2px solid #333;
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  font-family: "微軟正黑體", sans-serif;
  z-index: 999;
}

#recent-log-header {
  cursor: pointer;
  padding: 8px 12px;
  font-weight: bold;
  background: #f9f9f9;
  border-bottom: 1px solid #ccc;
}

#recent-log-content {
  max-height: 200px;
  overflow-y: auto;
  padding: 8px 12px;
  font-size: 14px;
}

#recent-log-content div {
  border-bottom: 1px solid #ddd;
  margin: 5px 0;
  padding-bottom: 5px;
}

.hidden {
  display: none;
}

.toast-box {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: center;
}
.mission-item {
  background: url('https://i.imgur.com/3G5eV1Q.png') no-repeat center center;  /* 任務卡背景圖片 */
  background-size: cover;
  padding: 10px 15px;
  margin: 8px 0;
  border-radius: 10px;
  color: #333;
  font-weight: bold;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.mission-info {
  flex-grow: 1;
}

.mission-reward {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 14px;
}

.mission-btn {
  padding: 6px 10px;
  border: none;
  border-radius: 6px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  margin-left: 10px;
}

.mission-btn.claim {
  background: #ffd700;
  color: #000;
}

.mission-btn.disabled {
  background: #ccc;
  color: #666;
  cursor: not-allowed;
}
.mission-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
  margin-top: 10px;
}

.mission-table th, .mission-table td {
  border: 1px solid #ccc;
  padding: 8px;
  text-align: center;
}

.mission-table th {
  background-color: #f8f2e9;
  color: #5c4033;
}

.mission-table td {
  background-color: #fffdfa;
}

.mission-table .btn-claim {
  background-color: #ffd700;
  border: none;
  padding: 5px 10px;
  border-radius: 5px;
  font-weight: bold;
  cursor: pointer;
}

.mission-table .btn-disabled {
  background-color: #ccc;
  color: #666;
  border: none;
  padding: 5px 10px;
  border-radius: 5px;
  cursor: not-allowed;
}

/* --- 全新的日常活動卡片樣式 --- */

/* 容納所有卡片的網格容器 */
.tasks-grid {
  display: grid;
  /* 自動填充，每個格子最小 120px，最大 1fr (平均分配剩餘空間) */
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 16px; /* 格子間的空隙 */
  padding: 10px;
}

/* 單張活動卡片的樣式 */
.daily-task-card {
  background: linear-gradient(145deg, #fffaf0, #fdf5e6); /* 溫暖的漸層背景 */
  border: 2px solid #d2b48c; /* 譚色邊框 */
  border-radius: 12px;
  padding: 20px 10px;
  font-size: 1rem;
  font-weight: bold;
  color: #6b4f3a; /* 深棕色文字 */
  cursor: pointer;
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1), inset 0 1px 1px rgba(255, 255, 255, 0.7);
  text-align: center;
  transition: all 0.2s ease-out;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 80px;
}

/* 滑鼠懸停在未完成的卡片上時 */
.daily-task-card:not(.completed):hover {
  transform: translateY(-4px);
  box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15), inset 0 1px 1px rgba(255, 255, 255, 0.7);
  border-color: #c19a6b; /* 邊框變亮 */
}

/* 已完成的卡片樣式 */
.daily-task-card.completed {
  background: linear-gradient(145deg, #f5f5f5, #e8e8e8); /* 灰色漸層 */
  border-color: #cccccc;
  color: #999999;
  text-decoration: line-through; /* 文字劃掉 */
  cursor: not-allowed;
  box-shadow: none; /* 移除陰影，看起來更扁平 */
}

/* 已完成的卡片在滑鼠懸停時沒有效果 */
.daily-task-card.completed:hover {
  transform: none;
  box-shadow: none;
}
.adventure-modal.hidden {
  display: none;
}
 
  </style>

<script>
  // ✅ 新增輔助函式，將後端日誌轉發到瀏覽器 Console
  function logToConsole(logData) {
    console.log('[APPS_SCRIPT_LOG]', logData);
  }

  // 頂層開始
google.script.run
  .withSuccessHandler(function(data) {
    try {
      console.log('✅ getProfileData 回傳：', data);

      if (data) {
        // ✅ 檢查並印出後端傳來的偵錯日誌
        if (data.debugLog && Array.isArray(data.debugLog)) {
          console.groupCollapsed("📄 後端狀態評估日誌");
          data.debugLog.forEach(log => console.log(log));
          console.groupEnd();
        }
        document.getElementById('background').src = data.backgroundUrl || '';
        document.getElementById('character').src = data.characterUrl || '';
        document.getElementById('playerName').innerText = data.playerName || '玩家';
        document.getElementById('birthday').innerText = "生日: " + (data.birthday || '未設定');
        document.getElementById('coins').innerText = (data.coins !== undefined) ? data.coins : 0;
        document.getElementById('honorPoints').innerText = (data.honorPoints !== undefined) ? data.honorPoints : 0;

const setAttr = (id, value) => {
  const num = parseFloat(value);
  document.getElementById(id).style.width = (!isNaN(num) ? num : 0) + "%";
  document.getElementById(`${id}-label`).innerText = `${getAttrLabel(id)} ${formatAttr(num)}/100`;
};

        const getAttrLabel = (id) => ({
        cleanliness: "清潔度",
        mood: "心情",
        energy: "精力",
        health: "健康",
        selfDiscipline: "自律"   // ✅ 最後一項不必加逗號，其他必須有
})[id];

        ['cleanliness', 'mood', 'energy', 'health', 'selfDiscipline'].forEach(id => setAttr(id, data[id]));

        if (!data.surveyFilledToday) {
          openSurveyModal();
        }
        // ✅ 初始載入時，直接使用 getProfileData 回傳的資料更新側邊欄
        if (data.StatusList) {
          updateSidePanel(data);
        } else {
          refreshMainGameUI(); // 作為安全備用方案
        }
      } else {
        showToast("⚠️ 資料為空，請稍後再試");
      }
    } catch (err) {
      console.error("🚨 渲染錯誤：", err);
      showToast("❌ 渲染資料失敗：" + err.message);
    } finally {

    }
  })
  .withFailureHandler(function(error) {

    console.error("❌ getProfileData() 錯誤：", error.message);
    showToast("❌ 載入失敗：" + error.message);
  })
  .getProfileData();




function openSurveyModal() {
  document.getElementById('survey-modal').classList.remove('hidden');
  google.script.run.withSuccessHandler(renderSurveyQuestions).getSurveyQuestions();
}

function renderSurveyQuestions(questions) {
  const box = document.getElementById('survey-questions');
  box.innerHTML = '';

  questions.forEach(q => {
    let html = `<div style="margin-bottom: 15px;"><strong>${q.Question}</strong><br/>`;

    if (q.Type === 'YesNo') {
      html += `
        <label><input type="radio" name="${q.QKey}" value="1">是</label>
        <label><input type="radio" name="${q.QKey}" value="0">否</label>
      `;
    } else if (q.Type === 'Number') {
      html += `<input type="number" name="${q.QKey}" placeholder="請輸入數字" min="0">`;
    } else if (q.Type === 'Select') {
      try {
        const options = JSON.parse(q.Options);
        html += `<select name="${q.QKey}">`;
        options.forEach(opt => {
          html += `<option value="${opt}">${opt}</option>`;
        });
        html += `</select>`;
      } catch (e) {
        console.error('Options JSON 解析錯誤：', q.Options);
      }
    }

    html += `</div>`;
    box.innerHTML += html;
  });
}



function submitSurvey() {
  const inputs = document.querySelectorAll('#survey-questions input, #survey-questions select');
  const formData = {};
  inputs.forEach(input => {
    if (input.type === 'radio') {
      if (input.checked) {
        formData[input.name] = input.value;
      }
    } else {
      formData[input.name] = input.value;
    }
  });

  console.log('表單送出：', formData);

  google.script.run.withSuccessHandler(() => {
    // ✅ 顯示成功訊息
    showToast("✔️ 問卷已送出！");

    // ✅ 關閉問卷 modal
    document.getElementById('survey-modal').classList.add('hidden');

    // ✅ 使用統一刷新方式更新所有畫面
    refreshMainGameUI();

  }).withFailureHandler(err => {
    showToast("❌ 發送失敗：" + err.message);
  }).handleSurvey(formData);
}



  
function toggleRecentLog() {
  const content = document.getElementById('recent-log-content');
  const toggle = document.getElementById('recent-log-toggle');

  const isHidden = content.classList.contains('hidden');
  content.classList.toggle('hidden');
  toggle.innerText = isHidden ? '▲' : '▼';

  if (isHidden) {
    console.log('[toggleRecentLog] 展開最近紀錄 ➜ 觸發 refreshRecentLog()');
    refreshRecentLog();
  }
}



function loadRecentLog() {
  google.script.run.withSuccessHandler(function(logs) {
    console.log("後端實際回傳：", logs);
    renderRecentLog(logs);
  }).getRecentLogs();
}

function renderRecentLog(logs) {
  const content = document.getElementById('recent-log-content');

  if (!logs || logs.length === 0) {
    content.innerHTML = `<div>沒有最近紀錄。</div>`;
  } else {
    content.innerHTML = logs.map(log => {
      let detail = '';

      if (log.Type === 'action') {
        const prefix = log.AffectValue > 0 ? '+' : ''; // 自動補 +
        detail = `行動 ➜ ${log.ActionName} (${mapFieldToName(log.AffectField)} ${prefix}${log.AffectValue})`;
      } else if (log.Type === 'reward' || log.Type === 'audit') {
        detail = `獎勵 ➜ ${log.RewardType || ''} ${log.RewardAmount || ''}`;
      } else {
        detail = `🗂️ ${log.Type || ''}`;
      }

      return `<div style="border-bottom:1px solid #ddd;padding:5px 0;">
        <strong>${log.CreatedAt}</strong> — ${detail}
      </div>`;
    }).join('');
  }
}
function formatAttr(val) {

}

function showToast(message, duration = 3000) {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.innerText = message;

  toast.style.cssText = `
    background: rgba(60, 60, 60, 0.9);
    color: #fff;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 16px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    animation: fadeInOut ${duration / 1000 + 0.5}s ease forwards;
  `;

  container.appendChild(toast);

  setTimeout(() => {

  }, duration);
}

function renderMissionList(missions) {
  const dailyBox = document.getElementById('mission-list-daily');
  const achievementBox = document.getElementById('mission-list-achievement');

  dailyBox.innerHTML = '';  // 清空
  achievementBox.innerHTML = '';

  const renderTable = (targetBox, filteredMissions) => {
    if (!filteredMissions.length) {
      targetBox.innerHTML = '<div>目前沒有任務</div>';
      return;
    }

    let html = `<table class="mission-table">
      <thead>
        <tr><th>📌 任務</th><th>🎁 獎勵</th><th>✅ 狀態</th><th>操作</th></tr>
      </thead><tbody>`;

    filteredMissions.forEach(m => {
      let statusText = '';
      let button = '';
      let progressHtml = '';

      if (m.claimed) {
        statusText = "✅ 已領取";
        button = `<button class="btn-disabled">已領取</button>`;
      } else if (m.fulfilled) {
        statusText = "✅ 已完成";
        button = `<button class="btn-claim" onclick="claimDailyTask('${m.id}')">領取</button>`;
      } else {
        const progress = m.currentProgress || 0;
        const target = m.targetValue || 1;
        // 只有目標大於 1 (非單次任務) 才顯示進度
        if (target > 1) {
          statusText = `⏳ 進行中 (${progress}/${target})`;
          const percentage = (progress / target) * 100;
          progressHtml = `
            <div style="width: 90%; margin: 4px auto 0 0; height: 6px; background-color: #e0e0e0; border-radius: 3px; overflow: hidden;">
              <div style="width: ${percentage}%; height: 100%; background-color: #4caf50; border-radius: 3px;"></div>
            </div>
          `;
        } else {
          statusText = "⏳ 未完成";
        }
        button = `<button class="btn-disabled">尚未完成</button>`;
      }

      html += `<tr>
        <td>${m.name}${progressHtml}</td>
        <td>${
  (m.rewardText || '')
    .replace(/\+(\d+)\s(\w+)/g, (_, val, field) => `+${val} ${mapFieldToName(field)}`)
}</td>

        <td>${statusText}</td>
        <td>${button}</td>
      </tr>`;
    });

    html += `</tbody></table>
      `;

    targetBox.innerHTML = html;
  };

  renderTable(dailyBox, missions.filter(m => m.type === 'Daily'));
  renderTable(achievementBox, missions.filter(m => m.type === 'Achievement'));
}

let FIELD_MAP = {};  // 全域欄位對照表（英文 ➜ 中文）

  document.getElementById('bag-modal').classList.remove('hidden');

function switchBagTab(tab) {

  tabs.forEach(t => {
    document.getElementById('bag-list-' + t).classList.toggle('hidden', t !== tab);
  });
  document.querySelectorAll('#bag-modal .tab-button').forEach((btn, idx) => {

function renderBagItems(items) { // ✅ 修改為手風琴樣式
  const group = { all: [], item: [], ticket: [] };

  items.forEach(i => {
    const itemType = i.ItemType || 'Consumable';
    const icon = getItemIcon(itemType);
    const label = `${icon} ${i.ItemName} x${i.Count}`;

    // --- 產生詳細資訊的 HTML ---
    const description = i.Description || '無說明';
    const effectLines = parseEffects(i.Effect);
    let effectHtml = effectLines.length
      ? '<ul style="margin:0; padding-left: 20px;">' + effectLines.map(l => `<li>${l}</li>`).join('') + '</ul>'
      : '無效果';

    let sellPriceHtml = '';
    if (i.SellPrice > 0) {
      sellPriceHtml = `<div style="margin-top:10px;color:#8b5e3c;">💰 可販售金幣：${i.SellPrice}</div>`;
    } else if (i.HonorSellPrice > 0) {
      sellPriceHtml = `<div style="margin-top:10px;color:#8b5e3c;">⭐ 可販售榮譽點數：${i.HonorSellPrice}</div>`;
    }

    // --- 產生按鈕 ---
    const canSell = i.IsSellable === true && (i.SellPrice > 0 || i.HonorSellPrice > 0);
    const sellBtn = canSell
      ? `<button onclick="showSellModal('${i.ItemID}', '${encodeURIComponent(i.ItemName)}', ${i.Count})">販售</button>`
      : `<button class="btn-disabled" disabled>不可販售</button>`;
    const actionBtn = `<button onclick="useItem('${i.ItemID}')">使用</button>`;

    // --- 組合最終的 HTML ---
    const html = `
      <div class="bag-item-container" style="border:1px solid #ccc; border-radius:6px; padding:8px; margin:8px 0; background:#fffdf9; transition: background-color 0.2s;">
        <div class="bag-item-header" style="display: flex; justify-content: space-between; align-items: center; cursor: pointer;" onclick="toggleItemDetail(this)">
            <strong>${label}</strong>
            <span class="toggle-icon" style="font-size: 1.2em; color: #888; transform: rotate(0deg); transition: transform 0.2s;">▼</span>
        </div>
        <div class="bag-item-detail hidden" style="margin-top: 8px; padding-top: 8px; border-top: 1px solid #eee; font-size: 14px;">
            <p style="margin: 0 0 8px 0;">${description}</p>
            <div><strong>效果:</strong>${effectHtml}</div>
            ${sellPriceHtml}
            <div class="item-actions" style="margin-top: 10px; text-align: right;">
                ${actionBtn} ${sellBtn}
            </div>
        </div>
      </div>`;

    group.all.push(html);
    group[itemType === 'Redeemable' ? 'ticket' : 'item'].push(html);
  });

  ['all', 'item', 'ticket'].forEach(t => {
    document.getElementById('bag-list-' + t).innerHTML = group[t].join('') || '<div>目前沒有物品</div>';
  });
}
function getItemIcon(itemType) {
  if (itemType === 'Redeemable') return '🎟️';
  if (itemType === 'Consumable') return '🧃';
  return '🎒';
}

function toggleItemDetail(headerElement) {
  const detailElement = headerElement.nextElementSibling;
  const iconElement = headerElement.querySelector('.toggle-icon');
  const isHidden = detailElement.classList.toggle('hidden');
  
  iconElement.style.transform = isHidden ? 'rotate(0deg)' : 'rotate(180deg)';
  iconElement.innerHTML = isHidden ? '▼' : '▲';
  headerElement.parentElement.style.backgroundColor = isHidden ? '#fffdf9' : '#f8f2e9';
}

function parseEffects(effectStr) {
  if (!effectStr) return [];
  try {
    const effects = JSON.parse(effectStr);
    if (typeof effects !== 'object' || effects === null || Array.isArray(effects)) {
      return [String(effectStr)];
    }
    const lines = Object.entries(effects).map(([field, value]) => {
      const numValue = Number(value);
      if (isNaN(numValue)) {
        return `${mapFieldToName(field)}: ${value}`;
      }
      const prefix = numValue >= 0 ? '+' : '';
      return `${mapFieldToName(field)} ${prefix}${numValue}`;
    });
    return lines.length > 0 ? lines : ['無特殊效果'];
  } catch (e) {
    return [String(effectStr)];
  }
}

function mapFieldToName(field) {
  return FIELD_MAP?.[field] || field;
}

function useItem(itemID) {
  if (!confirm("確定要使用這個道具嗎？")) return;
  google.script.run

      refreshMainGameUI();
      openBag(); // 重新刷新背包
    })
    .withFailureHandler(err => {
      showToast("❌ 錯誤：" + err.message);
    })
    .useItem(itemID);
}


let pendingSellItemID  = null;
let pendingSellMax     = 1;        // 可賣上限

// ① 打開 modal 時帶入 maxCount
function showSellModal(itemID, encodedItemName, maxCount) {
  pendingSellItemID = itemID;
  pendingSellMax    = maxCount;
  document.getElementById('confirm-sell-name').innerText = decodeURIComponent(encodedItemName);
  const qtyInput = document.getElementById('confirm-sell-qty');
  qtyInput.max   = maxCount;
  qtyInput.value = 1;
  document.getElementById('confirm-sell-modal').classList.remove('hidden');
}

// ② 送出時把數量一併傳到後端
function confirmSell() {
  if (!pendingSellItemID) return;
  const qty = Math.min(
      pendingSellMax,
      Math.max(1, parseInt(document.getElementById('confirm-sell-qty').value) || 1)
  );
  const itemID = pendingSellItemID;

  google.script.run
    .withSuccessHandler(msg => {
      showToast(msg || "✅ 已販售！");
      document.getElementById('confirm-sell-modal').classList.add('hidden'); // 在成功後才關閉
      pendingSellItemID = null; // 在成功後才重設
      refreshMainGameUI();
      refreshRecentLog();
      openBag();
    })
    .withFailureHandler(err => showToast(err.message || "❌ 失敗：" + err.message))
    .sellItem(itemID, qty);                 // ← 傳 qty
}

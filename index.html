<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>

body {
  margin: 0;
  overflow: hidden;
  font-family: "微軟正黑體", "Microsoft JhengHei", sans-serif;
}

    #background {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;
    }
    #character {
      position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); height: 60%;
    }

    .top-bar {
      position: absolute; top: 0; left: 0; width: 100%;
      background: rgba(255,255,255,0.6);
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 20px; z-index: 2; border-bottom: 1px solid #ccc;
    }

.top-left {
  display: flex;
  flex-direction: column;
  font-size: 18px;  /* 玩家名和生日稍微大一點 */
  color: #8b5e3c;
  font-weight: bold;
  text-shadow: 0 0 1px rgba(0, 0, 0, 0.2);
}

.resources {
  display: flex;
  gap: 15px;
  font-size: 16px;
  color: #8b5e3c;
  font-weight: bold;
  text-shadow: 0 0 1px rgba(0, 0, 0, 0.2);
}
/* ✅ 新增：狀態加成效果顯示區域 */
.effects-display {
  display: flex;
  gap: 10px;
  font-size: 14px;
  font-weight: bold;
  align-items: center;
}
.effect-item {
  background: rgba(34, 139, 34, 0.15); /* 淡綠色背景 */
  color: #228B22; /* 深綠色文字 */
  border: 1px solid rgba(34, 139, 34, 0.3);
  padding: 4px 10px;
  border-radius: 12px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  cursor: help;
}
.effect-item.coupon {
  background: rgba(220, 53, 69, 0.1); /* 淡紅色背景 */
  color: #a42834; /* 深紅色文字 */
  border: 1px solid rgba(220, 53, 69, 0.2);
}

    .attributes {
      display: flex; gap: 10px; margin-left: 20px;
    }

    .attribute {
      position: relative;
      width: 100px;
      height: 16px;
      background: #eee;
      border-radius: 4px;
    }

    .fill {
      height: 100%;
      background: linear-gradient(90deg, #70c1ff, #4da8da);
      border-radius: 4px;
    }

.attribute-label {
  position: absolute;
  top: -20px;
  left: 0;
  font-size: 14px;
  color: #8b5e3c;
  font-weight: bold;
  text-shadow: 0 0 1px rgba(0, 0, 0, 0.2);
}

    .gear {
      font-size: 20px; cursor: pointer;
    }

    .bottom-bar {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 15px;
    }

    .bottom-item {
      background: #fef9f4; border: 2px solid #d1cfc7; border-radius: 22px; width: 75px; height: 85px; /* 調整按鈕大小 */
      position: relative; /* ✅ 關鍵修正：讓紅點可以相對於此元素定位 */
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.1); cursor: pointer;
    }

    /* ✅ 新增：讓圖示填滿按鈕，並保留一點邊距 */
    .bottom-item img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* 確保圖片填滿容器，可能會裁切邊緣以維持比例 */
      border-radius: 20px; /* 配合外框的圓角 (比外框的 22px 略小) */
    }
    .icon {
      font-size: 24px;
    }
    .side-bar {
  position: absolute;
  top: 50%;
  right: 0;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  gap: 10px;
  background: rgba(255, 255, 255, 0.5);
  padding: 10px;
  border-radius: 8px 0 0 8px;
}

.side-item {
  cursor: pointer;
  font-size: 14px;
  padding: 8px;
  background: #fef9f4;
  border: 1px solid #d1cfc7;
  border-radius: 4px;
}
.adventure-modal {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(255,255,255,0.9);
  border: 2px solid #333;
  border-radius: 8px;
  padding: 20px;
  width: 80%;
  max-width: 600px;
  z-index: 10;
}

.adventure-content img {
  width: 100%;
  border-radius: 4px;
}

.adventure-text {
  margin-top: 15px;
  font-size: 16px;
  color: #333;
}

.adventure-options {
  margin-top: 20px;
  display: flex;
  gap: 10px;
  justify-content: center;
}

.hidden {
  display: none;
}
#side-panel {
  position: fixed;
  top: 80px;   /* 依照你的畫面可調 */
  left: 0;
  width: 220px;
  background: rgba(255, 255, 255, 0.85);
  border-right: 2px solid #ccc;
  padding: 10px;
  font-family: 'jf-openhuninn', sans-serif;
  z-index: 10;
}

#side-panel h4 {
  margin: 5px 0;
  font-size: 16px;
  border-bottom: 1px solid #999;
  padding-bottom: 3px;
}

#status-box, #attributes-box {
  margin-bottom: 20px;
}

.status-item {
  margin: 5px 0;
  font-size: 14px;
}

.status-detail {
  font-size: 12px;
  color: #666;
  margin-left: 15px;
}

.attribute-item {
  margin: 4px 0;
  font-size: 14px;
}
#recent-log-box {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 420px;
  background: rgba(255, 255, 255, 0.9);
  border: 2px solid #333;
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  font-family: "微軟正黑體", sans-serif;
  z-index: 999;
}

#recent-log-header {
  cursor: pointer;
  padding: 8px 12px;
  font-weight: bold;
  background: #f9f9f9;
  border-bottom: 1px solid #ccc;
}

#recent-log-content {
  max-height: 200px;
  overflow-y: auto;
  padding: 8px 12px;
  font-size: 14px;
}

#recent-log-content div {
  border-bottom: 1px solid #ddd;
  margin: 5px 0;
  padding-bottom: 5px;
}

.hidden {
  display: none;
}

.toast-box {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: center;
}
.mission-item {
  background: url('https://i.imgur.com/3G5eV1Q.png') no-repeat center center;  /* 任務卡背景圖片 */
  background-size: cover;
  padding: 10px 15px;
  margin: 8px 0;
  border-radius: 10px;
  color: #333;
  font-weight: bold;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.mission-info {
  flex-grow: 1;
}

.mission-reward {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 14px;
}

.mission-btn {
  padding: 6px 10px;
  border: none;
  border-radius: 6px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  margin-left: 10px;
}

.mission-btn.claim {
  background: #ffd700;
  color: #000;
}

.mission-btn.disabled {
  background: #ccc;
  color: #666;
  cursor: not-allowed;
}
.mission-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
  margin-top: 10px;
}

.mission-table th, .mission-table td {
  border: 1px solid #ccc;
  padding: 8px;
  text-align: center;
}

.mission-table th {
  background-color: #f8f2e9;
  color: #5c4033;
}

.mission-table td {
  background-color: #fffdfa;
}

.mission-table .btn-claim {
  background-color: #ffd700;
  border: none;
  padding: 5px 10px;
  border-radius: 5px;
  font-weight: bold;
  cursor: pointer;
}

.mission-table .btn-disabled {
  background-color: #ccc;
  color: #666;
  border: none;
  padding: 5px 10px;
  border-radius: 5px;
  cursor: not-allowed;
}

/* --- 全新的日常活動卡片樣式 --- */

/* 容納所有卡片的網格容器 */
.tasks-grid {
  display: grid;
  /* 自動填充，每個格子最小 120px，最大 1fr (平均分配剩餘空間) */
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 16px; /* 格子間的空隙 */
  padding: 10px;
}

/* 單張活動卡片的樣式 */
.daily-task-card {
  background: linear-gradient(145deg, #fffaf0, #fdf5e6); /* 溫暖的漸層背景 */
  border: 2px solid #d2b48c; /* 譚色邊框 */
  border-radius: 12px;
  padding: 20px 10px;
  font-size: 1rem;
  font-weight: bold;
  color: #6b4f3a; /* 深棕色文字 */
  cursor: pointer;
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1), inset 0 1px 1px rgba(255, 255, 255, 0.7);
  text-align: center;
  transition: all 0.2s ease-out;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 80px;
}

/* 滑鼠懸停在未完成的卡片上時 */
.daily-task-card:not(.completed):hover {
  transform: translateY(-4px);
  box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15), inset 0 1px 1px rgba(255, 255, 255, 0.7);
  border-color: #c19a6b; /* 邊框變亮 */
}

/* 已完成的卡片樣式 */
.daily-task-card.completed {
  background: linear-gradient(145deg, #f5f5f5, #e8e8e8); /* 灰色漸層 */
  border-color: #cccccc;
  color: #999999;
  text-decoration: line-through; /* 文字劃掉 */
  cursor: not-allowed;
  box-shadow: none; /* 移除陰影，看起來更扁平 */
}

/* 已完成的卡片在滑鼠懸停時沒有效果 */
.daily-task-card.completed:hover {
  transform: none;
  box-shadow: none;
}
.adventure-modal.hidden {
  display: none;
}
 
  </style>
</head>

<style>
/* --- 問卷專用樣式 --- */
.survey-question-item {
  background-color: #fdfaf5;
  border: 1px solid #e0d8cd;
  border-radius: 8px;
  padding: 15px;
  margin-bottom: 15px;

.survey-question-text {

}
.survey-answer-area {

  gap: 10px;
  align-items: center;
}
/* Yes/No 的特殊按鈕樣式 */
.survey-yesno {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.survey-yesno input[type="radio"] {

}
.survey-yesno label {
  padding: 10px;

  cursor: pointer;

}

  color: white;

}
/* 數字和下拉選單的樣式 */
.survey-input {

  border: 2px solid #d1bfa7;
  border-radius: 6px;

  font-size: 1em;

}
.survey-input:focus {

  border-color: #a08468;

}
</style>

function openSurveyModal() {
  document.getElementById('survey-modal').classList.remove('hidden');
  google.script.run.withSuccessHandler(renderSurveyQuestions).getSurveyQuestions();
}

function renderSurveyQuestions(questions) {
  surveyQuestionsData = questions; // 儲存題目資料以供後續驗證
  const box = document.getElementById('survey-questions');
  box.innerHTML = '';

  questions.forEach(q => {
    let answerHtml = '';

    if (q.Type === 'YesNo') {
      answerHtml = `
        <div class="survey-answer-area survey-yesno">
          <input type="radio" id="q_${q.QKey}_yes" name="${q.QKey}" value="1"><label for="q_${q.QKey}_yes">是</label>
          <input type="radio" id="q_${q.QKey}_no" name="${q.QKey}" value="0"><label for="q_${q.QKey}_no">否</label>
        </div>
      `;
    } else if (q.Type === 'Number') {
      answerHtml = `<div class="survey-answer-area"><input type="number" name="${q.QKey}" placeholder="請輸入數字" min="0" class="survey-input"></div>`;
    } else if (q.Type === 'Select') {
      try {
        const options = JSON.parse(q.Options);
        let optionsHtml = '';
        options.forEach(opt => {
          optionsHtml += `<option value="${opt}">${opt}</option>`;
        });
        answerHtml = `<div class="survey-answer-area"><select name="${q.QKey}" class="survey-input">${optionsHtml}</select></div>`;
      } catch (e) {
        console.error('Options JSON 解析錯誤：', q.Options);
      }
    }

    box.innerHTML += `
      <div class="survey-question-item">
        <div class="survey-question-text">${q.Question}</div>
        ${answerHtml}
      </div>
    `;
  });
}



function submitSurvey() {
  const inputs = document.querySelectorAll('#survey-questions input, #survey-questions select');
  const formData = {};
  inputs.forEach(input => {
    if (input.type === 'radio') {
      if (input.checked) {
        formData[input.name] = input.value;
      }
    } else {
      formData[input.name] = input.value;
    }
  });

  // 驗證是否所有問題都已回答
  let allAnswered = true;
  if (surveyQuestionsData.length > 0) {
    for (const q of surveyQuestionsData) {
      const answer = formData[q.QKey];
      if (answer === undefined || answer === null || answer === '') {
        allAnswered = false;
        break;
      }
    }
  }

  if (!allAnswered) {
    showToast("⚠️ 請回答所有問題才能送出！");
    return; // 中斷送出
  }

  console.log('表單送出：', formData);

  google.script.run.withSuccessHandler(function(msg) {
    // ✅ 顯示成功訊息
    showToast("✔️ 問卷已送出！");

    // ✅ 關閉問卷 modal
    document.getElementById('survey-modal').classList.add('hidden');

    // ✅ 使用統一刷新方式更新所有畫面
    refreshMainGameUI();

  }).withFailureHandler(err => {
    showToast("❌ 發送失敗：" + err.message);
  }).handleSurvey(formData);
}

function renderRecentLog(logs) {
  const content = document.getElementById('recent-log-content');

  if (!logs || logs.length === 0) {
    content.innerHTML = `<div>沒有最近紀錄。</div>`;
  } else {
    content.innerHTML = logs.map(log => {
      let detail = '';

      if (log.Type === 'action') {
        const prefix = log.AffectValue > 0 ? '+' : ''; // 自動補 +
        detail = `行動 ➜ ${log.ActionName} (${mapFieldToName(log.AffectField)} ${prefix}${log.AffectValue})`;
      } else if (log.Type === 'reward' || log.Type === 'audit') {
        detail = `獎勵 ➜ ${log.RewardType || ''} ${log.RewardAmount || ''}`;
      } else {
        detail = `🗂️ ${log.Type || ''}`;
      }

      return `<div style="border-bottom:1px solid #ddd;padding:5px 0;">
        <strong>${log.CreatedAt}</strong> — ${detail}
      </div>`;
    }).join('');
  }
}
function formatAttr(val) {
  // ✅【新修正】顯示到小數點後一位，讓玩家能即時看到小數點獎勵。
  const num = parseFloat(val) || 0;
  // 使用 toFixed(1) 來四捨五入到小數點後一位
  const fixedNumStr = num.toFixed(1);
  // 如果數字是整數 (例如 10.0)，則只顯示整數部分 "10"
  if (fixedNumStr.endsWith('.0')) {
    return Math.floor(num);
  }
  // 否則顯示帶有小數點的字串，例如 "10.1"
  return fixedNumStr;
}

    font-size: 16px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);

  setTimeout(() => {

  }, duration);
}

  achievementBox.innerHTML = '';

  const renderTable = (targetBox, filteredMissions) => {
    if (!filteredMissions.length) {
      targetBox.innerHTML = '<div>目前沒有任務</div>';
      return;
    }

    let html = `<table class="mission-table">
      <thead>
        <tr><th>📌 任務</th><th>🎁 獎勵</th><th>✅ 狀態</th><th>操作</th></tr>
      </thead><tbody>`;

    filteredMissions.forEach(m => {
      let statusText = '';
      let button = '';
      let progressHtml = '';

      if (m.claimed) {
        statusText = "✅ 已領取";
        button = `<button class="btn-disabled">已領取</button>`;
      } else if (m.fulfilled) {
        statusText = "✅ 已完成";
        button = `<button class="btn-claim" onclick="claimDailyTask('${m.id}')">領取</button>`;
      } else {
        const progress = m.currentProgress || 0;
        const target = m.targetValue || 1;
        // 只有目標大於 1 (非單次任務) 才顯示進度
        if (target > 1) {
          statusText = `⏳ 進行中 (${progress}/${target})`;
          const percentage = (progress / target) * 100;
          progressHtml = `
            <div style="width: 90%; margin: 4px auto 0 0; height: 6px; background-color: #e0e0e0; border-radius: 3px; overflow: hidden;">
              <div style="width: ${percentage}%; height: 100%; background-color: #4caf50; border-radius: 3px;"></div>
            </div>
          `;
        } else {
          statusText = "⏳ 未完成";
        }
        button = `<button class="btn-disabled">尚未完成</button>`;
      }

      html += `<tr>
        <td>${m.name}${progressHtml}</td>
        <td>${m.rewardText || ''}</td>
        <td>${statusText}</td>
        <td>${button}</td>
      </tr>`;
    });

    html += `</tbody></table>
      `;

    targetBox.innerHTML = html;
  };

  renderTable(dailyBox, missions.filter(m => m.type === 'Daily'));
  renderTable(achievementBox, missions.filter(m => m.type === 'Achievement'));
}

  // --- 更新並播放金幣動畫 ---

  if (honorDiff !== 0) {
    animateValueChange(honorContainer, honorDiff);

  currentDisplayValues.HonorPoints = honorVal;

  // ✅【核心修正】將 fieldToIdMap 的鍵改為小寫，與後端回傳的資料一致
  const fieldToIdMap = {

    energy: 'energy',
    health: 'health',

  };

  Object.entries(fieldToIdMap).forEach(([field, id]) => {
    const num = Number(data[field]) || 0; // 現在 field 是小寫的 'cleanliness'，可以正確讀取 data.cleanliness

/**
 * [新函式] 播放數值變動動畫
 * @param {HTMLElement} targetElement - 動畫要顯示在哪個元素附近
 * @param {number} change - 變動的數值 (正數或負數)
 */
function animateValueChange(targetElement, change) {
  if (!targetElement || change === 0) return;

  const changeText = change > 0 ? `+${change}` : `${change}`;
  const color = change > 0 ? '#28a745' : '#dc3545'; // 綠色代表增加，紅色代表減少

  const animationEl = document.createElement('span');
  animationEl.className = 'value-change-animation';
  animationEl.innerText = changeText;
  animationEl.style.color = color;

  // 將動畫元素添加到 body 中，並根據目標元素定位
  document.body.appendChild(animationEl);
  const rect = targetElement.getBoundingClientRect();
  animationEl.style.left = `${rect.left + rect.width / 2 - animationEl.offsetWidth / 2}px`;
  animationEl.style.top = `${rect.top - animationEl.offsetHeight}px`;

  // 為目標元素添加短暫的高亮效果
  targetElement.classList.add('highlight-change');
  setTimeout(() => {
    targetElement.classList.remove('highlight-change');
  }, 800);

  // 動畫結束後移除元素
  setTimeout(() => {
    animationEl.remove();
  }, 1900);
}

function renderBagItems(items) {
  // ✅ 新增排序邏輯
  const typeOrder = {
    'TreasureChest': 1,
    'FixedBundle': 2,
    'CurrencyPouch': 3,
    'Consumable': 4,
    'Redeemable': 5,
    'Unknown': 99
  };

  items.sort((a, b) => {
    const orderA = typeOrder[a.ItemType] || 90;
    const orderB = typeOrder[b.ItemType] || 90;
    if (orderA !== orderB) {
      return orderA - orderB;
    }
    const rarityA = parseInt(a.Rarity) || 0;
    const rarityB = parseInt(b.Rarity) || 0;
    if (rarityA !== rarityB) {
      return rarityB - rarityA; // 高星等的排前面
    }
    return (a.ItemID || '').localeCompare(b.ItemID || '');
  });

  const group = { all: [], item: [], ticket: [] };

  items.forEach(i => {
    const itemType = i.ItemType || 'Consumable';
    const icon = getItemIcon(itemType);

    // ✅ 新增：在物品名稱後加上星星
    let rarityStars = '';
    const rarityValue = parseInt(i.Rarity);
    if (rarityValue > 0 && rarityValue <= 5) {
      rarityStars = ` <span style="color: #DAA520; font-weight: normal;">${'★'.repeat(rarityValue)}</span>`;
    }
    const label = `${icon} ${i.ItemName}${rarityStars} x${i.Count}`;
    
    // --- 產生詳細資訊的 HTML ---
    const description = i.Description || '無說明';
    let effectHtml;

    // ✅ 新增：產生稀有度說明的 HTML
    let rarityHtml = '';
    const rarity = parseInt(i.Rarity);
    if (rarity > 0 && rarity <= 5) {
      const stars = '★'.repeat(rarity) + '☆'.repeat(5 - rarity);
      rarityHtml = `<div style="margin-bottom: 8px; color: #DAA520; font-weight: bold;">稀有度：${stars}</div>`;
    }

    // ✅ 針對禮包和貨幣包，顯示更友善的效果說明
    if (itemType === 'FixedBundle' || itemType === 'CurrencyPouch') {
      effectHtml = '<i style="color:#666;">(請參考物品說明)</i>';
    } else {
      const effectLines = parseEffects(i.Effect);
      effectHtml = effectLines.length
        ? '<ul style="margin:0; padding-left: 20px;">' + effectLines.map(l => `<li>${l}</li>`).join('') + '</ul>'
        : '無效果';
    }
    let sellPriceHtml = '';
    if (i.SellPrice > 0) {
      sellPriceHtml = `<div style="margin-top:10px;color:#8b5e3c;">💰 可販售金幣：${i.SellPrice}</div>`;
    } else if (i.HonorSellPrice > 0) {
      sellPriceHtml = `<div style="margin-top:10px;color:#8b5e3c;">⭐ 可販售榮譽點數：${i.HonorSellPrice}</div>`;
    }

    // --- 產生按鈕 ---
    const canSell = i.IsSellable === true && (i.SellPrice > 0 || i.HonorSellPrice > 0);
    const sellBtn = canSell
      ? `<button onclick="showSellModal('${i.ItemID}', '${encodeURIComponent(i.ItemName)}', ${i.Count})">販售</button>`
      : `<button class="btn-disabled" disabled>不可販售</button>`;

    // ✅ 新增十連開按鈕
    let tenUseBtn = '';
    if (i.ItemType === 'TreasureChest' && i.Count >= 10) {
      tenUseBtn = `<button onclick="playChestAnimationAndOpen(10, '${i.ItemID}', false)" style="background-color: #4682B4; color: white;">使用10個</button>`;
    }

    const actionBtn = `<button onclick="handleUseItem('${i.ItemID}', '${encodeURIComponent(i.ItemName)}', ${i.Count}, '${i.ItemType}')">使用</button>`;

    // --- 組合最終的 HTML ---
    const html = `
      <div class="bag-item-container" style="border:1px solid #ccc; border-radius:6px; padding:8px; margin:8px 0; background:#fffdf9; transition: background-color 0.2s;">
        <div class="bag-item-header" style="display: flex; justify-content: space-between; align-items: center; cursor: pointer;" onclick="toggleItemDetail(this)">

            <span class="toggle-icon" style="font-size: 1.2em; color: #888; transform: rotate(0deg); transition: transform 0.2s;">▼</span>
        </div>
        <div class="bag-item-detail hidden" style="margin-top: 8px; padding-top: 8px; border-top: 1px solid #eee; font-size: 14px;">
            ${rarityHtml}
            <p style="margin: 0 0 8px 0;">${description}</p>            
            <div><strong>效果:</strong>${effectHtml}</div>

            <div class="item-actions" style="margin-top: 10px; text-align: right;">
                ${actionBtn} ${tenUseBtn} ${sellBtn}

        </div>
      </div>`;

    group.all.push(html);

    // ✅ 修正：將物品正確分類到「道具」或「卷」分頁

  if (itemType === 'Redeemable') return '🎟️';

  if (itemType === 'OneTimeDiscountCoupon') return '🏷️'; // ✅ 新增折扣券圖示

function toggleItemDetail(headerElement) {
  const detailElement = headerElement.nextElementSibling;
  const iconElement = headerElement.querySelector('.toggle-icon');
  const isHidden = detailElement.classList.toggle('hidden');
  
  iconElement.style.transform = isHidden ? 'rotate(0deg)' : 'rotate(180deg)';
  iconElement.innerHTML = isHidden ? '▼' : '▲';
  headerElement.parentElement.style.backgroundColor = isHidden ? '#fffdf9' : '#f8f2e9';
}

function parseEffects(effectStr) {
  if (!effectStr) return [];
  try {
    const effects = JSON.parse(effectStr);
    if (typeof effects !== 'object' || effects === null || Array.isArray(effects)) {
      return [String(effectStr)];
    }
    const lines = Object.entries(effects).map(([field, value]) => {
      const numValue = Number(value);
      if (isNaN(numValue)) {
        return `${mapFieldToName(field)}: ${value}`;
      }
      const prefix = numValue >= 0 ? '+' : '';
      return `${mapFieldToName(field)} ${prefix}${numValue}`;
    });
    return lines.length > 0 ? lines : ['無特殊效果'];
  } catch (e) {
    return [String(effectStr)];
  }
}

function mapFieldToName(field) {
  return FIELD_MAP?.[field] || field;
}

function renderShopItems(items) {
  if (!items || items.length === 0) {
    document.getElementById('shop-list-coin-all').innerHTML = '<div>商店目前沒有商品。</div>';
    document.getElementById('shop-list-honor-all').innerHTML = '<div>商店目前沒有商品。</div>';
    return;
  }

  // ✅ 排序邏輯 (與背包相同)
  const typeOrder = { 'TreasureChest': 1, 'FixedBundle': 2, 'CurrencyPouch': 3, 'Consumable': 4, 'Redeemable': 5, 'Unknown': 99 };
  items.sort((a, b) => {
    const orderA = typeOrder[a.ItemType] || 90;
    const orderB = typeOrder[b.ItemType] || 90;
    if (orderA !== orderB) return orderA - orderB;
    const rarityA = parseInt(a.Rarity) || 0;
    const rarityB = parseInt(b.Rarity) || 0;
    if (rarityA !== rarityB) return rarityB - rarityA;
    return (a.ItemID || '').localeCompare(b.ItemID || '');
  });

  // ✅ 將商品按貨幣類型分組
  const coinItems = items.filter(item => item.BuyPrice > 0);
  const honorItems = items.filter(item => item.HonorBuyPrice > 0 && item.BuyPrice <= 0);

  // ✅ 渲染函式
  const renderGroup = (itemList, currencyType) => {
    const groups = { all: [], chest: [], item: [] };
    const priceIcon = currencyType === 'coin' ? '💰' : '⭐';

    itemList.forEach(item => {
      const icon = getItemIcon(item.ItemType);
      const description = item.Description || '無說明';
      const effectLines = parseEffects(item.Effect);
      let effectHtml = effectLines.length
        ? '<ul style="margin:0; padding-left: 20px; font-size: 13px;">' + effectLines.map(l => `<li>${l}</li>`).join('') + '</ul>'
        : '無效果';

      // --- 價格顯示邏輯 ---
      let priceHtml;
      let tenPullButton = '';
      const originalPrice = currencyType === 'coin' ? item.BuyPrice : item.HonorBuyPrice;
      const originalTenPullPrice = originalPrice * 10;

      if (item.IsOnSale) {
        const salePrice = currencyType === 'coin' ? item.SalePrice : item.HonorSalePrice;
        priceHtml = `<div style="margin-top: 5px; font-weight: bold; color: #dc3545;">${priceIcon} ${salePrice} <del style="color:#999; margin-left:5px;">${originalPrice}</del></div>`;
        if (item.ItemType === 'TreasureChest') {
          const tenPullPriceHtml = `<div style="margin-top: 5px; font-weight: bold; color: #dc3545;">${priceIcon} ${salePrice * 10} <del style="color:#999; margin-left:5px;">${originalTenPullPrice}</del></div>`;
          tenPullButton = `<div><button onclick="playChestAnimationAndOpen(10, '${item.ItemID}', true)" class="${currencyType === 'honor' ? 'honor-buy-btn' : ''}" style="font-size: 1em; padding: 8px 12px;">購買10個</button>${tenPullPriceHtml}</div>`;
        }
      } else if (activeEffects.nextPurchaseDiscount > 0) {
        const discountRate = (100 - activeEffects.nextPurchaseDiscount) / 100;
        const finalPrice = Math.round(originalPrice * discountRate);
        priceHtml = `<div style="margin-top: 5px; font-weight: bold; color: #dc3545;">${priceIcon} ${finalPrice} <del style="color:#999; margin-left:5px;">${originalPrice}</del></div>`;
        if (item.ItemType === 'TreasureChest') {
          const finalTenPullPrice = Math.round(originalTenPullPrice * discountRate);
          const tenPullPriceHtml = `<div style="margin-top: 5px; font-weight: bold; color: #dc3545;">${priceIcon} ${finalTenPullPrice} <del style="color:#999; margin-left:5px;">${originalTenPullPrice}</del></div>`;
          tenPullButton = `<div><button onclick="playChestAnimationAndOpen(10, '${item.ItemID}', true)" class="${currencyType === 'honor' ? 'honor-buy-btn' : ''}" style="font-size: 1em; padding: 8px 12px;">購買10個</button>${tenPullPriceHtml}</div>`;
        }
      } else {
        // 沒有特價，檢查 Buff 折扣
        const discountRate = (100 - (activeEffects.shopDiscount || 0)) / 100;
        const finalPrice = Math.round(originalPrice * discountRate);

        if (finalPrice < originalPrice) {
          priceHtml = `<div style="margin-top: 5px; font-weight: bold; color: #28a745;">${priceIcon} ${finalPrice} <del style="color:#999; margin-left:5px;">${originalPrice}</del></div>`;
        } else {
          priceHtml = `<div style="margin-top: 5px; font-weight: bold;">${priceIcon} ${originalPrice}</div>`;
        }
        if (item.ItemType === 'TreasureChest') {
          const finalTenPullPrice = Math.round(originalTenPullPrice * discountRate);
          const tenPullPriceHtml = (finalTenPullPrice < originalTenPullPrice)
            ? `<div style="margin-top: 5px; font-weight: bold; color: #28a745;">${priceIcon} ${finalTenPullPrice} <del style="color:#999; margin-left:5px;">${originalTenPullPrice}</del></div>`
            : `<div style="margin-top: 5px; font-weight: bold;">${priceIcon} ${originalTenPullPrice}</div>`;
          tenPullButton = `<div><button onclick="playChestAnimationAndOpen(10, '${item.ItemID}', true)" class="${currencyType === 'honor' ? 'honor-buy-btn' : ''}" style="font-size: 1em; padding: 8px 12px;">購買10個</button>${tenPullPriceHtml}</div>`;
        }
      }

      const html = `
        <div class="shop-item-container ${currencyType === 'honor' ? 'honor-item' : ''}" style="display: flex; align-items: center; border:1px solid #ccc; border-radius:6px; padding:8px; margin:8px 0; gap: 15px;">
          <div style="font-size: 2em;">${icon}</div>
          <div style="flex-grow: 1;">
              <strong style="font-size: 1.1em;">${item.ItemName}</strong>
              <p style="font-size: 0.9em; color: #666; margin: 4px 0;">${description}</p>
              <div style="font-size: 0.9em;"><strong>效果:</strong>${effectHtml}</div>
          </div>
          <div style="text-align: right;">
              <div style="display:flex; flex-direction:column; gap: 8px;">
                <div><button onclick="buyItem('${item.ItemID}')" class="${currencyType === 'honor' ? 'honor-buy-btn' : ''}" style="font-size: 1em; padding: 8px 12px;">購買1個</button>${priceHtml}</div>
                ${tenPullButton}
              </div>
          </div>
        </div>
      `;
      groups.all.push(html);
      if (item.ItemType === 'TreasureChest' || item.ItemType === 'FixedBundle' || item.ItemType === 'CurrencyPouch') {
        groups.chest.push(html); // 寶箱、禮包、錢包都歸在寶箱類
      } else {
        groups.item.push(html);
      }
    });

    ['all', 'chest', 'item'].forEach(cat => {
      document.getElementById(`shop-list-${currencyType}-${cat}`).innerHTML = groups[cat].join('') || '<div style="padding: 20px; text-align: center; color: #888;">此分類沒有商品。</div>';
    });
  };

  // ✅ 分別渲染金幣和榮譽商店
  renderGroup(coinItems, 'coin');
  renderGroup(honorItems, 'honor');

  // ✅ 修正：舊的 renderShopItems 邏輯，現在已整合到 renderGroup 中
  /*
  items.forEach(item => {
    const isHonorItem = item.HonorBuyPrice > 0 && item.BuyPrice <= 0;
  ...
  */
}

/**
 * [新函式] 播放開箱動畫並處理後端呼叫
 * @param {number} quantity - 開啟數量 (1 或 10)
 * @param {string} itemID - 寶箱的 ItemID
 * @param {boolean} isPurchase - 是否為從商店購買 (影響刷新邏輯)
 */
function playChestAnimationAndOpen(quantity, itemID, isPurchase = false) {
  const modal = document.getElementById('chest-opening-modal');
  const img = document.getElementById('chest-animation-img');
  const text = document.getElementById('chest-opening-text');

  // ✅【修正】根據開啟數量顯示正確的提示文字，避免開啟 2-9 個時也顯示「十連抽」
  if (quantity >= 10) {
    text.innerText = '正在進行十連抽...';
  } else if (quantity > 1) {
    text.innerText = `正在開啟 ${quantity} 個寶箱...`;
  } else {
    text.innerText = '正在開啟寶箱...';
  }
  modal.classList.remove('hidden');
  img.classList.add('shake');
  
  // 在晃動動畫結束後 (0.8秒)，開始播放發光動畫，讓等待過程不單調
  setTimeout(() => {
    img.classList.remove('shake');
    img.classList.add('pulsing');
  }, 800);

  const successHandler = (results) => {
    modal.classList.add('hidden'); // 隱藏動畫
    img.classList.remove('pulsing'); // 停止發光
    showToast(`🎉 開箱完成！`);
    if (isPurchase) {
      refreshMainGameUI(refreshShopItems);
    } else {
      refreshMainGameUI(openBag); // 刷新背包
    }
    renderTenPullResults(results); // 顯示結果
  };

  const failureHandler = (err) => {
    modal.classList.add('hidden');
    // 確保所有動畫 class 都被移除
    img.classList.remove('shake'); 
    img.classList.remove('pulsing');
    showToast(`❌ 開啟失敗：` + err.message);
  };

  // ✅【核心修正】統一呼叫新的後端函式
  google.script.run
    .withSuccessHandler(successHandler)
    .withFailureHandler(failureHandler)
    .openMultipleChests(itemID, quantity, isPurchase);
}

      mailContainer.querySelector('strong').style.fontWeight = 'normal';
    })
    .withFailureHandler(err => { showToast(`❌ 操作失敗：${err.message}`); button.disabled = false; button.textContent = '標示為已讀'; })
    .markMailAsReadAndGetCount(mailId);
}
</script>

<!-- ✅ 新增：成就系統相關腳本 -->
<script>
function openAchievementModal() {
  document.getElementById('achievement-modal').classList.remove('hidden');
  // 預設顯示提交分頁
  switchAchievementTab('submit');
}

function switchAchievementTab(tab) {
  const submitTab = document.getElementById('achievement-submit-tab');
  const historyTab = document.getElementById('achievement-history-tab');
  const buttons = document.querySelectorAll('#achievement-modal .tab-button');

  if (tab === 'submit') {
    submitTab.classList.remove('hidden');
    historyTab.classList.add('hidden');
    buttons[0].classList.add('active');
    buttons[1].classList.remove('active');
  } else { // history
    submitTab.classList.add('hidden');
    historyTab.classList.remove('hidden');
    buttons[0].classList.remove('active');
    buttons[1].classList.add('active');
    // 載入歷史紀錄
    // ✅【修正】不要覆蓋整個 tab，而是將載入提示放在目標容器內
    const milestoneContainer = document.getElementById('achievement-history-milestone');
    const recentContainer = document.getElementById('achievement-history-recent');
    if (milestoneContainer) milestoneContainer.innerHTML = '<div>正在載入歷史成就...</div>';
    if (recentContainer) recentContainer.innerHTML = ''; // 清空另一個分頁

    google.script.run
      .withSuccessHandler(renderAchievementHistory)
      .withFailureHandler(err => { 
        if (milestoneContainer) milestoneContainer.innerHTML = `<div>無法載入：${err.message}</div>`; 
      })
      .getCompletedAchievements();
  }
}

function submitAchievement() {
  const category = document.getElementById('achievement-category').value;
  const itemName = document.getElementById('achievement-item-name').value;
  const description = document.getElementById('achievement-desc').value;

  if (!category || !itemName || !description) {
    showToast("⚠️ 請填寫所有欄位！");
    return;
  }

  showToast("⏳ 正在提交...", 2000);
  google.script.run
    .withSuccessHandler(msg => {
      showToast(msg);
      document.getElementById('achievement-category').value = '';
      document.getElementById('achievement-item-name').value = '';
      document.getElementById('achievement-desc').value = '';
      closeModal(document.getElementById('achievement-modal').querySelector('button'));
    })
    .withFailureHandler(err => {
      showToast(`❌ 提交失敗：${err.message}`);
    })
    .submitAchievement(category, itemName, description);
}

function renderAchievementHistory(data) {
  const { milestones, recents } = data;
  const milestoneContainer = document.getElementById('achievement-history-milestone');
  const recentContainer = document.getElementById('achievement-history-recent');

  const renderList = (achievements) => {
    if (!achievements || achievements.length === 0) {
      return '<div style="text-align:center; padding: 20px; color: #888;">此分類沒有已完成的成就。</div>';
    }

    let html = '';
    achievements.forEach(ach => {
      const approvalDate = ach.ApprovalDate ? new Date(ach.ApprovalDate).toLocaleDateString() : '未知日期';
      
      html += `
        <div class="bag-item-container" style="background:#f9f9f9;">
          <div class="bag-item-header" style="display: flex; justify-content: space-between; align-items: center; cursor: pointer;" onclick="toggleItemDetail(this)">
              <strong>🏆 [${ach.Category}] ${ach.ItemName}</strong>
              <span style="font-size: 14px; color: #888;">${approvalDate}</span>
          </div>
          <div class="bag-item-detail hidden" style="margin-top: 8px; padding-top: 8px; border-top: 1px solid #eee; font-size: 14px;">
              <p style="margin: 0 0 10px 0; white-space: pre-wrap;">${ach.Description}</p>
          </div>
        </div>
      `;
    });
    return html;
  };

  milestoneContainer.innerHTML = renderList(milestones);
  recentContainer.innerHTML = renderList(recents);

  // 預設顯示里程碑
  switchAchievementHistoryTab('milestone');

  // 如果里程碑是空的，但近期成果有東西，則自動切換到近期成果
  if ((!milestones || milestones.length === 0) && (recents && recents.length > 0)) {
    switchAchievementHistoryTab('recent');
    return;
  }
}
</script>

<!-- ✅ 新增：換裝系統相關腳本 -->
<script>
  // 用於儲存換裝間中的預覽選項
  let wardrobeSelection = {
    background: null,
    character: null
  };

  function openWardrobe() {
    const modal = document.getElementById('wardrobe-modal');
    modal.classList.remove('hidden');
    const selectionContainer = document.getElementById('wardrobe-selection');
    selectionContainer.innerHTML = '<div>正在載入您的衣櫃...</div>';

    google.script.run
      .withSuccessHandler(renderWardrobe)
      .withFailureHandler(err => {
        selectionContainer.innerHTML = `<div>無法載入：${err.message}</div>`;
      })
      .getWardrobeItems(); // 假設後端有此函式
  }

  function renderWardrobe(data) {
    const { ownedItems, equippedItems, counts } = data;
    const selectionContainer = document.getElementById('wardrobe-selection');
    selectionContainer.innerHTML = '';

    // 初始化預覽和選擇狀態
    wardrobeSelection.background = equippedItems.background;
    wardrobeSelection.character = equippedItems.character;
    updateWardrobePreview();

    const categories = {
      Background: [],
      Character: []
    };

    ownedItems.forEach(item => {
      if (categories[item.ItemType]) {
        categories[item.ItemType].push(item);
      }
    });

    const renderCategory = (title, type, items) => {
      let itemsHtml = items.map(item => {
        const isSelected = wardrobeSelection[type.toLowerCase()] === item.ItemID;
        return `
          <div class="wardrobe-item-card ${isSelected ? 'selected' : ''}" 
               id="wardrobe-item-${item.ItemID}"
               style="background-image: url('${item.AssetUrl}')" 
               onclick="selectWardrobeItem('${type.toLowerCase()}', '${item.ItemID}', '${item.AssetUrl}')">
            <div class="item-name">${item.ItemName}</div>
          </div>
        `;
      }).join('');

      return `
        <div class="wardrobe-category" id="wardrobe-category-${type.toLowerCase()}">
          <h4>
            ${title}
            <span style="font-weight: normal; font-size: 0.9em; color: #666;">(已擁有 ${counts[type.toLowerCase()].owned} / ${counts[type.toLowerCase()].total})</span>
          </h4>
          <div class="wardrobe-item-grid">${itemsHtml}</div>
        </div>
      `;
    };

    selectionContainer.innerHTML += renderCategory('🖼️ 背景', 'Background', categories.Background || []);
    selectionContainer.innerHTML += renderCategory('👤 造型', 'Character', categories.Character || []);
  }

  function selectWardrobeItem(type, itemId, assetUrl) {
    // 更新選擇
    wardrobeSelection[type] = itemId;
    
    // 更新預覽
    updateWardrobePreview();

    // 更新UI上 'selected' class
    document.querySelectorAll(`#wardrobe-category-${type} .wardrobe-item-card`).forEach(card => {
      card.classList.remove('selected');
    });
    document.getElementById(`wardrobe-item-${itemId}`).classList.add('selected');
  }

  function updateWardrobePreview() {
    document.getElementById('wardrobe-preview-bg').src = document.getElementById(`wardrobe-item-${wardrobeSelection.background}`)?.style.backgroundImage.slice(5, -2) || '';
    document.getElementById('wardrobe-preview-char').src = document.getElementById(`wardrobe-item-${wardrobeSelection.character}`)?.style.backgroundImage.slice(5, -2) || '';
  }

  function saveOutfit() {
    showToast('正在儲存您的新造型...', 2000);
    google.script.run
      .withSuccessHandler(function(newProfileData) {
        showToast('✅ 造型已更新！');
        // ✅【核心修正】直接使用後端回傳的最新資料更新UI，不再呼叫 refreshMainGameUI()
        console.log("🔄 造型儲存成功，直接使用回傳資料更新UI:", newProfileData);
        updateUIWithProfileData(newProfileData, 'saveOutfit');
        closeModal(document.getElementById('wardrobe-modal').querySelector('button'));
      })
      .withFailureHandler(err => { showToast(`❌ 儲存失敗：${err.message}`); })
      .updateEquippedItems(wardrobeSelection); // 假設後端有此函式
  }

  // ✅ 新增：統一的UI更新函式
  function updateUIWithProfileData(data, source = 'Unknown') {
    console.log(`🔄 [${source}] 正在使用新資料更新UI:`, data);

    // ✅ 修正：只有在初始載入時才需要設定玩家名稱和生日
    if (source === 'initialLoad') {
        document.getElementById('playerName').innerText = data.playerName || '玩家';
        document.getElementById('birthday').innerText = "生日: " + (data.birthday || '未設定');
    }

    if (data.characterUrl) {
        document.getElementById('character').src = data.characterUrl;
    }
    if (data.backgroundUrl) {
        document.getElementById('background').src = data.backgroundUrl;
    }
    updateHeaderBar(data);
    updateSidePanel(data);
    if (data.effectsSummary) {
        activeEffects = data.effectsSummary;
        activeEffects.nextPurchaseDiscount = data.NextPurchaseDiscount || 0;
        updateEffectsDisplay(activeEffects);
    }
    const badge = document.getElementById('mail-badge');
    const unreadCount = data.unreadMailCount || 0;
    if (badge) {
        badge.textContent = unreadCount;
        badge.classList.toggle('hidden', unreadCount === 0);
    }
  }
</script>
